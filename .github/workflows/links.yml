name: Check links

on:
  pull_request:
    paths: ["**.md", "lychee.toml"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress README.md CONTRIBUTING.md
          fail: true
          jobSummary: true
      - name: Open an issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links report
          content-filepath: ./lychee/out.md
          labels: maintenance
